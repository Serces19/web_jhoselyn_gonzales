name: E0 isolated checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked
      - run: . .venv/bin/activate && uv run pytest -q
      - run: python -m compileall -q infrastructure/lambda_api
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_COGNITO_USER_POOL_ID: us-east-1_build
      VITE_COGNITO_CLIENT_ID: offline-build
      VITE_API_ENDPOINT: https://api.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

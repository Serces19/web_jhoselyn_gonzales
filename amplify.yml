version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend && npm ci
    build:
      commands:
        - cd frontend && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*

  # ----------------------------------------------------------------
  # REDIRECT DINÁMICO PARA QR DE TARJETAS DE PRESENTACIÓN
  # ----------------------------------------------------------------
  # El QR impreso apunta a: https://main.d2caobufsyec5z.amplifyapp.com/go
  #
  # Para cambiar el destino cuando tengas dominio:
  #   1. Edita la línea "target" abajo con tu nuevo dominio
  #   2. git commit + push → Amplify redeploya automáticamente
  #   ──────────────────────────────────────────────────────────────
  # O hazlo sin código:
  #   Amplify Console → tu app → Rewrites and redirects → editar /go
  # ----------------------------------------------------------------
  customHeaders:
    - pattern: '/go'
      headers:
        - key: 'Cache-Control'
          value: 'no-store'
  redirects:
    # === REDIRECT DEL QR === Cambia "target" cuando tengas dominio
    - source: /go
      target: https://main.d2caobufsyec5z.amplifyapp.com/
      status: '302'
      condition: null

    # SPA fallback — necesario para React Router
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
      target: /index.html
      status: '200'
      condition: null

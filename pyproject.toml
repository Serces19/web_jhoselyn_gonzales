[project]
name = "jhoselyn-web-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2", "tzdata>=2026.1; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8,<10", "moto[dynamodb]>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infrastructure/lambda_api"]
